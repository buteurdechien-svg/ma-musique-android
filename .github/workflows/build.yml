name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compiler
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk MaMusique.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaMusique-apk
          path: MaMusique.apk
